# Strategy-specific parameters

mttf:  # Multi-Timeframe Trend Following
  name: "Multi-Timeframe Trend Following"
  timeframes:
    daily: "D"
    h4: "H4"
    h1: "H1"
  ema_fast: 50
  ema_slow: 200
  ema_entry: 21
  rsi_period: 14
  rsi_oversold: 40
  rsi_overbought: 60
  atr_period: 14
  stop_loss_atr: 2
  take_profit_atr: 3

mean_reversion_sr:  # Mean Reversion on Support/Resistance
  name: "Mean Reversion S/R"
  timeframes:
    daily: "D"
    h4: "H4"
  pivot_tolerance: 0.003  # 0.3%
  pin_bar_wick_ratio: 0.6
  rsi_period: 14
  atr_period: 14
  stop_loss_atr: 1

volatility_breakout:  # Bollinger Squeeze
  name: "Volatility Breakout"
  timeframe: "D"
  bb_period: 20
  bb_std: 2.0
  bb_width_period: 20
  bb_width_multiplier: 1.5
  ema_fast: 50
  ema_slow: 200
  stop_loss_ratio: 0.5  # Middle of BB
  risk_reward: 2

rsi_divergence:  # RSI Divergence + Break of Structure
  name: "RSI Divergence"
  timeframe: "H4"
  rsi_period: 14
  swing_lookback: 10
  atr_period: 14

range_trading:  # Range Trading with Probability Zones
  name: "Range Trading"
  timeframe: "D"
  range_min_days: 15
  range_variation_threshold: 0.02
  rsi_period: 14
  rsi_oversold: 30
  rsi_overbought: 70
  atr_period: 14
  stop_loss_atr: 1

seasonality:  # Seasonality + Trend Alignment
  name: "Seasonality"
  timeframes:
    weekly: "W"
    daily: "D"
    h4: "H4"
  ema_fast: 50
  ema_slow: 200
  ema_entry: 21
  atr_period: 14
  stop_loss_atr: 2
  take_profit_atr: 3
  seasonal_bias:
    EUR_USD:
      9: -1  # September bearish
      12: 1  # December bullish
    USD_JPY:
      10: 1  # Q4 bullish
      11: 1
      12: 1

correlation_arb:  # Multi-Pair Correlation Arbitrage
  name: "Correlation Arbitrage"
  timeframe: "D"
  pairs:
    - ["EUR_USD", "GBP_USD"]
  correlation_period: 20
  correlation_threshold: 0.5
  zscore_threshold: 2
  zscore_exit: 0.5
  atr_period: 14
  stop_loss_atr: 2

breakout_retest:  # Breakout with Retest
  name: "Breakout Retest"
  timeframe: "D"
  consolidation_days: 10
  consolidation_atr_ratio: 1.5
  breakout_atr_ratio: 1.5
  retest_max_days: 5
  atr_period: 14
  stop_loss_atr: 1
  take_profit_ratio: 2

carry_trade:  # Carry Trade + Technical Filter
  name: "Carry Trade"
  timeframes:
    weekly: "W"
    daily: "D"
    h4: "H4"
  ema_fast: 50
  ema_slow: 200
  ema_entry: 21
  ema_trailing: 21
  atr_period: 14
  stop_loss_atr: 3
  carry_pairs:
    AUD_JPY: 1  # Bullish bias
    NZD_JPY: 1

zscore_meanrev:  # Z-Score Mean Reversion
  name: "Z-Score Mean Reversion"
  timeframe: "D"
  sma_period: 50
  zscore_threshold: 2
  rsi_period: 14
  rsi_oversold: 30
  rsi_overbought: 70
  atr_period: 14
  stop_loss_atr: 2
